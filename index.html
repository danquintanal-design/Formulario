<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="petsitter" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>petsitter</title>
</head>
<body>
  <div class="tarjeta-formulario">
    
    <form>
      <h2>Petsitter</h2>
      
      <div class="fila campo">
        <div class="columna">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Ej: María">
        </div>
        <div class="columna">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" placeholder="Ej: González">
        </div>
      </div>

      <label>Correo electrónico:</label>
      <input type="email" placeholder="ej: javier@gmail.com"><br><br>

      <label>Teléfono:</label>
      <input type="tel" placeholder="ej: 999999999"><br><br>

      <label>Género:</label>
      <input type="radio" name="genero"> Masculino<br>
      <input type="radio" name="genero"> Femenino<br>
      <input type="radio" name="genero"> Otro<br><br>

    <button class="button is-danger">Botón</button>
    </form>
  </div>
</html>
